<svg width="1200" height="400" viewBox="0 0 1200 400"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>

    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#8bd5ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#ffffff"
            stroke-opacity=".045"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Moving light -->
  <rect x="-300" y="0" width="250" height="400"
        fill="url(#line)"
        opacity=".12">
    <animate attributeName="x"
             from="-300"
             to="1250"
             dur="7s"
             repeatCount="indefinite"/>
  </rect>

  <!-- Decorative lines -->
  <g opacity=".5">
    <path d="M0 310 C250 230 390 350 600 270 S950 190 1200 250"
          fill="none"
          stroke="#7dd3fc"
          stroke-opacity=".15"
          stroke-width="1"/>

    <path d="M0 330 C250 250 390 370 600 290 S950 210 1200 270"
          fill="none"
          stroke="#ffffff"
          stroke-opacity=".08"
          stroke-width="1"/>
  </g>

  <!-- Floating code particles -->
  <g fill="#7dd3fc" filter="url(#glow)">
    <circle cx="90" cy="80" r="2">
      <animate attributeName="cy"
               values="80;65;80"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1080" cy="100" r="2">
      <animate attributeName="cy"
               values="100;120;100"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="980" cy="320" r="2">
      <animate attributeName="cx"
               values="980;1000;980"
               dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="160" cy="300" r="2">
      <animate attributeName="cx"
               values="160;140;160"
               dur="4.5s"
               repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Terminal -->
  <g transform="translate(70 65)" opacity=".65">
    <rect width="280" height="145" rx="12"
          fill="#080b0f"
          stroke="#ffffff"
          stroke-opacity=".1"/>

    <circle cx="18" cy="18" r="4" fill="#ffffff" opacity=".4"/>
    <circle cx="33" cy="18" r="4" fill="#ffffff" opacity=".25"/>
    <circle cx="48" cy="18" r="4" fill="#ffffff" opacity=".15"/>

    <text x="20" y="55"
          fill="#7dd3fc"
          font-family="monospace"
          font-size="13">
      &gt; build_web()
    </text>

    <text x="20" y="80"
          fill="#ffffff"
          opacity=".55"
          font-family="monospace"
          font-size="12">
      AI-assisted development
    </text>

    <text x="20" y="105"
          fill="#ffffff"
          opacity=".4"
          font-family="monospace"
          font-size="12">
      creating something...
    </text>

    <rect x="20" y="120"
          width="100"
          height="2"
          fill="#7dd3fc">
      <animate attributeName="width"
               values="20;180;60;140;20"
               dur="3s"
               repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Main title -->
  <text x="600" y="190"
        text-anchor="middle"
        fill="url(#text)"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="800"
        letter-spacing="4">
    GÖKDAĞ KANDEMİR
  </text>

  <!-- Animated underline -->
  <rect x="390" y="215"
        width="420"
        height="2"
        rx="2"
        fill="url(#line)">
    <animate attributeName="width"
             values="250;420;300;420"
             dur="4s"
             repeatCount="indefinite"/>
    <animate attributeName="x"
             values="475;390;450;390"
             dur="4s"
             repeatCount="indefinite"/>
  </rect>

  <!-- Subtitle -->
  <text x="600" y="255"
        text-anchor="middle"
        fill="#ffffff"
        opacity=".65"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        letter-spacing="5">
    VIBE CODER • WEB • AI
  </text>

  <!-- Small status -->
  <text x="600" y="292"
        text-anchor="middle"
        fill="#7dd3fc"
        opacity=".55"
        font-family="monospace"
        font-size="12">
    &lt; turning ideas into digital experiences /&gt;
  </text>

  <!-- Right code decoration -->
  <g transform="translate(930 55)"
     fill="#ffffff"
     opacity=".12"
     font-family="monospace"
     font-size="13">

    <text y="20">{</text>
    <text x="15" y="45">const idea = true;</text>
    <text x="15" y="70">AI.create();</text>
    <text x="15" y="95">build("web");</text>
    <text y="120">}</text>
  </g>

  <!-- Bottom line -->
  <rect x="100" y="350"
        width="1000"
        height="1"
        fill="#ffffff"
        opacity=".08"/>

  <text x="600" y="375"
        text-anchor="middle"
        fill="#ffffff"
        opacity=".3"
        font-family="monospace"
        font-size="11"
        letter-spacing="2">
    GOKDAGKANDEMIR.DEV
  </text>

</svg>
